<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoodleTracker</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/static/favicon.svg" alt="" /> Moodle<span>Tracker</span></div>
    <nav class="tabs" aria-label="Seções">
      <a href="#/dashboard" data-view="dashboard">Dashboard</a>
      <a href="#/items" data-view="items">Itens</a>
      <a href="#/runs" data-view="runs">Execuções</a>
    </nav>
    <div class="topbar-right">
      <div id="health" class="health" title="Status"><span class="dot"></span><span class="label">…</span></div>
      <button id="run-now" class="btn btn-primary" type="button" title="Executar pipeline agora">▶<span class="hide-sm"> Executar agora</span></button>
    </div>
  </header>

  <main id="view" class="container"></main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div id="drawer-body"></div>
    </section>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
